name: Release

# Publishing is not idempotent: a crate name and version pair can never be
# reused, and a yanked version cannot be un-yanked. So this workflow is written
# to refuse rather than to guess, and it is safe to re-run after a partial
# failure because each crate is skipped when its version is already on the
# registry.

on:
  push:
    tags: [ "v*.*.*" ]
  # Manual runs are a no-op unless `publish` is ticked, which makes "do not
  # upload by accident" structural instead of something to remember. There is
  # no separate dry-run switch: the test job already runs `cargo package
  # --workspace`, which is the local equivalent, and a switch that only causes
  # the publishing jobs to be skipped is a switch that does nothing.
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to crates.io and attach binaries to the GitHub Release"
        type: boolean
        default: false

# Read-only by default; the release job asks for what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail any build script or rustc invocation that emits a warning we asked for.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be checked without credentials.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is not used here on purpose: the MSRV in
      # Cargo.toml (`rust-version`) is what consumers are promised, so it is
      # checked separately below rather than being the default toolchain.
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      # The map samples are gitignored and belong to other people, so the
      # end-to-end read path is exercised against an archive generated here.
      # It has a known-correct answer by construction, and it pins the assembly
      # the unit tests cannot: header at offset 512, four member layouts, and
      # both the deflated and the stored sector branches.
      - name: Synthetic archive round trip
        run: |
          set -euo pipefail
          cargo run --example make_synthetic -p war3-archive -- /tmp/synthetic.w3x
          # Exit code 1 means "succeeded with diagnostics": this archive
          # deliberately has no (listfile).
          cargo run -p war3-cli -- map list /tmp/synthetic.w3x > /tmp/listed.txt || test $? -eq 1
          cat /tmp/listed.txt
          for member in WAR3MAP.W3I WAR3MAP.W3E WAR3MAP.J WAR3MAP.WTS; do
            grep -q "$member" /tmp/listed.txt
          done
          cargo run -p war3-cli -- map file /tmp/synthetic.w3x war3map.j > /tmp/script.j || test $? -eq 1
          grep -q 'function main' /tmp/script.j

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      # `cargo package` rewrites path dependencies to registry ones and builds
      # the result, which is the closest local equivalent of what crates.io
      # will do. It does not prove the dependencies are published, though --
      # that is what the publish job's dependency wait is for.
      - name: Package
        run: cargo package --workspace --locked

  # ---------------------------------------------------------------------------
  # MSRV. `rust-version = "1.75"` is a promise; without this job it is only a
  # claim in a manifest.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["workspace"]["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - name: Install MSRV toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"

      # --locked because the committed lockfile is what CI should resolve.
      # `cargo build` rather than `cargo test` because the tests use nothing
      # beyond the standard library, so building every target is enough.
      - name: Build on MSRV
        run: cargo build --workspace --all-targets --locked

  # ---------------------------------------------------------------------------
  # WASM. The core is supposed to stay compilable for the browser target, and
  # without a job that is only a claim in the README. This is what stops a
  # platform-specific dependency, or a `std::fs` call in the wrong crate, from
  # creeping in unnoticed.
  #
  # `war3-cli` is excluded: it is the binary, and a binary has no wasm build.
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Every crate this builds is a library, so cargo emits an rlib and no
      # linker or extra wasm tooling runs.
      - name: Build the core crates for wasm32
        run: cargo build --workspace --exclude war3-cli --target wasm32-unknown-unknown --locked

  # ---------------------------------------------------------------------------
  # crates.io. `harbor` computes this order from the workspace's own dependency
  # graph, because `cargo publish` resolves each dependency against the live
  # registry and therefore cannot publish a crate before everything it depends on.
  #
  # ⚠️ That order is deliberately NOT written down here any more. It used to be a
  # string in a shell loop, and it was wrong -- `war3-object` was listed before
  # `war3-map`, which it depends on -- so the release stopped on the impossible
  # dependency and retried it for ten minutes before blaming the registry index.
  # An order with one correct answer should be computed, not maintained. `harbor`
  # also validates the graph before uploading anything: a cycle, a published crate
  # that depends on an excluded one, or a member pattern matching nothing all fail
  # immediately instead of half way through a release.
  #
  # Which crates ship is likewise a property of each crate (`publish = false` in
  # its manifest), not a list kept here. `war3-cli` says so itself: it is a binary,
  # and it is kept out so the binary reaches map authors as a GitHub Release
  # artifact instead of through `cargo install`. That is a choice about how this
  # release is delivered, not a statement that the crate cannot be published --
  # it is publishable, and becomes part of this list the moment that line goes.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [ test, msrv, wasm ]
    runs-on: ubuntu-latest
    # `inputs` is null outside workflow_dispatch, and `!null` evaluates to true,
    # so the event has to be named explicitly rather than inferred from the
    # inputs alone.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish == true
    # No `environment:` here on purpose. Declaring one moves the secret into
    # environment scope and requires that environment to exist before the first
    # run, for a gate this project does not need yet; the token is read from
    # Settings -> Secrets and variables -> Actions instead. To add a manual
    # approval gate later, create the environment, add `environment: <name>`
    # back and move the secret into it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # The release tool. It is the only thing that decides anything now: what publishes,
      # in what order, and what to do when the registry answers badly. Everything this job
      # used to work out in shell is one `harbor plan` inside it.
      #
      # To run against an unpublished harbor, replace this with
      # `cargo install --path ../harbor --locked` and check harbor out beside this repo.
      - name: Install the release tool
        run: cargo install harbor --locked

      # `check` is three guards that used to be shell here, plus the one thing shell could
      # not do well: it tells "the secret is missing" apart from "the secret is set but
      # empty", which is the failure that looks like a permissions problem instead.
      #
      # The token is passed through the environment and never as an argument, so it cannot
      # reach a log by way of cargo echoing a command line.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            cargo harbor --root . check "$GITHUB_REF_NAME"
          else
            cargo harbor --root . check
          fi

      # The order is computed from the workspace's own dependency graph, so there is no
      # string here to keep in step with it -- and no way to write `war3-object` before
      # `war3-map`, which is the mistake this job used to be able to make silently.
      #
      # A crate the registry already holds is not an error (a re-run finishing a partial
      # release is the normal case); a dependency the index has not indexed yet is waited
      # for; anything else stops the release at once, because retrying a bad token or a
      # compile error only spends ten minutes arriving at the same failure.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor --root . publish

  # ---------------------------------------------------------------------------
  # The binary. This is the artifact most users actually want: they are map
  # authors, not Rust developers, so `cargo install` is the wrong delivery
  # mechanism for them.
  # ---------------------------------------------------------------------------
  binaries:
    name: Build binaries
    needs: [ publish ]
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: war3-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: war3-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: war3-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: war3-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p war3-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf "../../../${{ matrix.archive }}" war3
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/war3.exe" `
                           -DestinationPath "${{ matrix.archive }}"

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --verify-tag makes this fail loudly if the tag is missing rather
          # than silently creating a release from the default branch.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber
