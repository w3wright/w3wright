[package]
name = "war3-object"
description = "Warcraft III object data (.w3u and the other object files)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
war3-core = { workspace = true }
war3-meta = { workspace = true }
# For the map's string table. ⚠️ A map's `unam` field is usually a `TRIGSTR_nnn` reference rather
# than text, so naming an object means resolving one — see `src/names.rs`. The dependency is on the
# **string table type**, not on map parsing: nothing here opens a map.
war3-map = { workspace = true }

# Only `examples/objects_roundtrip.rs` needs to open map archives: parsing and
# writing object data is independent of the container it arrived in, so the
# library itself does not depend on the archive reader. Cargo builds examples
# with the package's dev-dependencies, which is where a dependency used by
# nothing but an example belongs.
[dev-dependencies]
war3-archive = { workspace = true }
