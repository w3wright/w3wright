[package]
name = "war3-cli"
description = "CLI umbrella crate providing the `war3` binary. Depends on every other crate; none depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "war3"
path = "src/main.rs"

[dependencies]
war3-core.workspace = true
war3-archive.workspace = true
war3-map.workspace = true
war3-terrain.workspace = true
war3-meta.workspace = true
war3-object.workspace = true
war3-project.workspace = true
# `mpq` because a command line has nowhere else to get the game's data from: there is no host
# application to hand it an `AssetSource`, so it opens the archives itself.
war3-game = { workspace = true, features = ["mpq"] }
